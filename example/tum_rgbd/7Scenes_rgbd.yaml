# 7-Scenes RGB-D config for Structure-PLP-SLAM
# Intrinsics: Microsoft Kinect v1, 640x480
# depth stored as uint16 PNG, depth_m = pixel_value / 1000.0 (DA3 output)

Camera.name: "7-Scenes RGBD"
Camera.setup: "RGBD"
Camera.model: "perspective"

Camera.fx: 525.0
Camera.fy: 525.0
Camera.cx: 319.5
Camera.cy: 239.5

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0
Camera.k3: 0.0

Camera.fps: 30.0
Camera.cols: 640
Camera.rows: 480
Camera.focal_x_baseline: 40.0

Camera.color_order: "RGB"

#================#
# ORB Parameters #
#================#

Feature.max_num_keypoints: 3000
Feature.scale_factor: 1.2
Feature.num_levels: 8
Feature.ini_fast_threshold: 12
Feature.min_fast_threshold: 4

#=====================#
# Tracking Parameters #
#=====================#

depth_threshold: 40.0
depthmap_factor: 1000.0

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer.keyframe_size: 0.05
PangolinViewer.keyframe_line_width: 1
PangolinViewer.graph_line_width: 1
PangolinViewer.point_size: 2
PangolinViewer.camera_size: 0.08
PangolinViewer.camera_line_width: 3
PangolinViewer.viewpoint_x: 0
PangolinViewer.viewpoint_y: -0.9
PangolinViewer.viewpoint_z: -1.9
PangolinViewer.viewpoint_f: 400
